<!-- File: templates/base.html (hoặc thư mục templates chung) -->
<!DOCTYPE html>
<html lang="vi" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}vnxBox Holding Platform{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        /* Tinh chỉnh thanh cuộn đẹp mắt */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #0B0F17;
        }

        ::-webkit-scrollbar-thumb {
            background: #1F2937;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
    </style>
</head>

<body class="h-full bg-[#0B0F17] text-gray-100 font-sans antialiased overflow-hidden">
    {% block content %}
    {% endblock %}
</body>

</html>
