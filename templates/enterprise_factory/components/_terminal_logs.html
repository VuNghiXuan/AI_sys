<!-- File: enterprise_factory/templates/enterprise_factory/components/_terminal_logs.html
 (Chức năng: Drawer hiển thị terminal debug log thời gian thực khi giao tiếp qua WebSocket)
  -->
<div x-show="showLogsDrawer" @click.away="showLogsDrawer = false"
    class="absolute right-0 top-0 bottom-0 w-96 bg-slate-900/95 border-l border-slate-800 p-4 flex flex-col shadow-2xl z-30 transition-transform">
    <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center space-x-1.5">
            <span>⚡ Terminal Debug Logs</span>
        </h3>
        <button @click="showLogsDrawer = false" class="text-slate-400 hover:text-white text-sm font-bold">✕</button>
    </div>
    <div class="flex-1 overflow-y-auto space-y-2 mt-3 font-mono text-[11px]">
        <template x-for="log in logs.slice().reverse()" :key="log.time + log.text">
            <div class="bg-slate-950 border border-slate-800/80 rounded p-2 text-amber-200/90">
                <span class="text-slate-500 text-[10px]" x-text="log.time"></span>
                <p class="mt-1 whitespace-pre-wrap" x-text="log.text"></p>
            </div>
        </template>
    </div>
</div>
