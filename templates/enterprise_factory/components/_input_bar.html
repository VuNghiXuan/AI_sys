<!-- File: enterprise_factory/templates/enterprise_factory/components/_input_bar.html 
 (Chức năng: Thanh input dưới đáy màn hình, popup gợi ý danh sách khi gõ phím @ và nút gửi)
 -->
<div class="bg-slate-900 border-t border-slate-800 p-4 relative z-30 shadow-xl">

    <!-- POPUP GỢI Ý MENTION KHI GÕ PHÍM @ -->
    <div x-show="showMentionMenu" @click.outside="showMentionMenu = false" x-cloak
        class="absolute bottom-20 left-4 w-80 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl overflow-hidden z-50 animate-fadeIn backdrop-blur-xl">
        <div
            class="px-3 py-2 bg-slate-800 text-xs font-semibold text-slate-300 border-b border-slate-700 flex justify-between items-center">
            <span>🎯 Chọn nhân sự hoặc phòng ban</span>
            <span
                class="text-[10px] text-emerald-400 font-mono bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800">Dùng
                Phím @</span>
        </div>
        <div class="max-h-52 overflow-y-auto p-1.5 space-y-1 custom-scrollbar">
            <!-- Tùy chọn broadcast @all -->
            <div @click="selectMention('@all')"
                class="px-3 py-2.5 hover:bg-amber-950/80 hover:text-amber-200 rounded-lg cursor-pointer flex items-center justify-between text-sm text-amber-400 font-bold border border-amber-900/50 bg-amber-950/30 transition">
                <span>@all (Toàn bộ tập đoàn)</span>
                <span
                    class="text-[10px] bg-amber-900/80 text-amber-200 px-2 py-0.5 rounded font-mono border border-amber-700">Broadcast</span>
            </div>
            <!-- Danh sách Agent động -->
            <template x-for="agent in agents" :key="agent.agent_id">
                <div @click="selectMention('@' + agent.agent_id)"
                    class="px-3 py-2 hover:bg-slate-800 rounded-lg cursor-pointer flex items-center justify-between text-sm transition group">
                    <div class="flex items-center space-x-2.5">
                        <!-- Avatar thu nhỏ trong popup -->
                        <template x-if="agent.avatar_url">
                            <img :src="agent.avatar_url"
                                class="w-7 h-7 rounded-full border border-slate-700 object-cover" alt="">
                        </template>
                        <template x-if="!agent.avatar_url">
                            <div
                                class="w-7 h-7 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-bold text-emerald-400">
                                AI
                            </div>
                        </template>
                        <div class="flex flex-col">
                            <span class="font-semibold text-slate-200 group-hover:text-emerald-400 transition"
                                x-text="agent.display_name"></span>
                            <span class="text-[10px] text-slate-400 font-mono" x-text="'@' + agent.agent_id"></span>
                        </div>
                    </div>
                    <!-- Huy hiệu vai trò -->
                    <span class="text-[10px] px-2 py-0.5 rounded font-mono border uppercase" :class="{
                        'bg-red-950 text-red-300 border-red-800': String(agent.role_type || '') === 'BOD',
                        'bg-blue-950 text-blue-300 border-blue-800': String(agent.role_type || '').includes('DEV'),
                        'bg-purple-950 text-purple-300 border-purple-800': String(agent.role_type || '') === 'HR',
                        'bg-emerald-950 text-emerald-300 border-emerald-800': String(agent.role_type || '') === 'QA',
                        'bg-slate-800 text-slate-300 border-slate-700': !['BOD', 'DEV', 'HR', 'QA'].some(r => String(agent.role_type || '').includes(r))
                    }" x-text="agent.role_type"></span>
                </div>
            </template>
        </div>
    </div>

    <!-- FORM GỬI CHỈ ĐẠO -->
    <form @submit.prevent="sendDirective()" class="flex space-x-3 items-center">
        <div class="relative flex-1">
            <input type="text" x-model="directiveText" @input="checkMention($event)"
                placeholder="Nhập lệnh chỉ đạo (Gõ '@' để gọi nhân sự, vd: @BOD_CEO_01 ...)..."
                class="w-full bg-slate-950 border border-slate-700 hover:border-slate-600 rounded-xl px-4 py-3.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition shadow-inner">
        </div>

        <button type="submit" :disabled="loading"
            class="bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 disabled:opacity-50 text-white font-semibold px-6 py-3.5 rounded-xl text-sm shadow-lg shadow-emerald-950/50 transition-all duration-200 flex items-center justify-center min-w-[150px]">
            <span x-show="!loading" class="flex items-center space-x-1.5">
                <span>🚀</span>
                <span>Gửi Chỉ Đạo</span>
            </span>
            <span x-show="loading" class="flex items-center space-x-2">
                <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
                <span>Đang xử lý...</span>
            </span>
        </button>
    </form>
</div>
