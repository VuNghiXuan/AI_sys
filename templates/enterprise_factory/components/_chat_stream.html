<!-- File: enterprise_factory/templates/enterprise_factory/components/_chat_stream.html -->
<!-- CHỨC NĂNG: Hiển thị danh sách tin nhắn, phân định lề hoàn toàn bằng sender_type từ DB kèm Avatar và Feedback -->
<div class="flex-1 overflow-y-auto p-6 space-y-6 flex flex-col-reverse custom-scrollbar" id="chat-stream">
    <template x-for="item in discussions" :key="item.id || item.created_at">
        <div class="flex flex-col w-full animate-fadeIn" :class="isUserMessage(item) ? 'items-end' : 'items-start'">

            <!-- Tiêu đề người gửi, Avatar & Thời gian -->
            <div class="flex items-center space-x-2.5 mb-1.5 px-1"
                :class="isUserMessage(item) ? 'flex-row-reverse space-x-reverse' : ''">

                <!-- Avatar nhỏ hiển thị bên cạnh tên (Nếu có) -->
                <template x-if="!isUserMessage(item) && item.avatar_url">
                    <img :src="item.avatar_url"
                        class="w-6 h-6 rounded-full border border-slate-700 object-cover shadow-sm" alt="Avatar">
                </template>
                <template x-if="!isUserMessage(item) && !item.avatar_url">
                    <div
                        class="w-6 h-6 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-bold text-emerald-400">
                        AI
                    </div>
                </template>

                <!-- Nhãn tên (Sếp/Người dùng màu tím đậm, Agent phân màu theo hệ thống) -->
                <div class="flex items-center space-x-1.5">
                    <span class="font-bold px-2.5 py-0.5 rounded border shadow-sm font-mono text-xs"
                        :class="isUserMessage(item) ? 'bg-indigo-950 text-indigo-300 border-indigo-800' : getAgentBadgeClass(getSenderLabel(item))"
                        x-text="getSenderLabel(item)">
                    </span>
                    <!-- Hiển thị chức danh phụ (VD: Tổng Giám Đốc Điều Hành) -->
                    <span class="text-[11px] text-slate-400 font-medium"
                        x-text="item.title_name ? '• ' + item.title_name : ''"></span>
                </div>

                <!-- Thời gian -->
                <span class="text-[10px] text-slate-500 font-mono" x-text="item.created_at"></span>
            </div>

            <!-- Khung chứa nội dung chat -->
            <div class="rounded-2xl px-4 py-3 max-w-3xl shadow-lg text-sm leading-relaxed transition-all"
                :class="isUserMessage(item) ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-900 border border-slate-800/80 text-slate-200 rounded-bl-none shadow-slate-900/50'">
                <!-- Nội dung tin nhắn hỗ trợ xuống dòng chuẩn xác -->
                <p class="whitespace-pre-wrap font-sans tracking-wide" x-text="item.message_content"></p>
            </div>

            <!-- 🧠 Cụm nút Self-Learning Feedback (Chỉ hiển thị cho tin nhắn của Agent AI ở lề trái) -->
            <template x-if="!isUserMessage(item)">
                <div
                    class="flex items-center space-x-2 mt-2 ml-1 text-xs opacity-80 hover:opacity-100 transition-opacity">
                    <span class="text-[10px] text-slate-500 font-mono">Đánh giá huấn luyện:</span>

                    <!-- Nút Thả Tim (❤️) - Học vĩnh viễn -->
                    <button @click="sendFeedback(item, 'LOVE')" title="Tuyệt vời - Học vĩnh viễn"
                        class="hover:bg-red-950/80 text-slate-400 hover:text-red-400 transition cursor-pointer px-2 py-0.5 rounded bg-slate-900/60 border border-slate-800 text-xs shadow-sm">
                        ❤️
                    </button>

                    <!-- Nút Like (👍) - Chính xác -->
                    <button @click="sendFeedback(item, 'LIKE')" title="Chính xác - Ghi nhớ"
                        class="hover:bg-green-950/80 text-slate-400 hover:text-green-400 transition cursor-pointer px-2 py-0.5 rounded bg-slate-900/60 border border-slate-800 text-xs shadow-sm">
                        👍
                    </button>

                    <!-- Nút Dislike (👎) - Cần cải thiện -->
                    <button @click="sendFeedback(item, 'DISLIKE')" title="Chưa đúng - Cần cải thiện"
                        class="hover:bg-yellow-950/80 text-slate-400 hover:text-yellow-400 transition cursor-pointer px-2 py-0.5 rounded bg-slate-900/60 border border-slate-800 text-xs shadow-sm">
                        👎
                    </button>

                    <!-- Nút Sửa luồng (🎯) - Correct intent -->
                    <button @click="sendFeedback(item, 'CORRECT')" title="Sửa luồng xử lý"
                        class="hover:bg-blue-950/80 text-slate-400 hover:text-blue-400 transition cursor-pointer px-2.5 py-0.5 rounded bg-slate-900/60 border border-slate-800 font-mono text-[11px] flex items-center space-x-1 shadow-sm">
                        <span>🎯</span>
                        <span>Sửa luồng</span>
                    </button>
                </div>
            </template>

        </div>
    </template>
</div>
