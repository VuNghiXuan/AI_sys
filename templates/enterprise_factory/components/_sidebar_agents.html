<!-- File: enterprise_factory/templates/enterprise_factory/components/_sidebar_agents.html 
(Chức năng: Hiển thị danh sách nhân sự AI trực chiến ở cột trái, click vào để gọi @mention)-->
<aside class="w-80 bg-slate-900/60 border-r border-slate-800 flex flex-col">
    <div class="p-4 border-b border-slate-800 bg-slate-900/80 flex justify-between items-center">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Hội đồng Nhân sự AI</h2>
        <span class="text-[10px] text-emerald-400 bg-emerald-950/80 px-2 py-0.5 rounded border border-emerald-800">Click
            để gọi @</span>
    </div>

    <div class="flex-1 overflow-y-auto p-4 space-y-3">
        <template x-for="agent in agents" :key="agent.agent_id">
            <div @click="insertMention(agent.agent_id)"
                class="bg-slate-800/60 border border-slate-700/60 rounded-lg p-3 shadow-sm cursor-pointer hover:border-emerald-500 transition group">
                <div class="flex justify-between items-start">
                    <h3 class="font-semibold text-sm text-slate-200 group-hover:text-emerald-400 transition"
                        x-text="agent.display_name"></h3>
                    <span class="text-[10px] px-2 py-0.5 rounded font-mono border" :class="{
                        'bg-red-950 text-red-300 border-red-800': String(agent.role_type || '') === 'BOD',
                        'bg-blue-950 text-blue-300 border-blue-800': String(agent.role_type || '').includes('DEV'),
                        'bg-purple-950 text-purple-300 border-purple-800': String(agent.role_type || '') === 'HR',
                        'bg-emerald-950 text-emerald-300 border-emerald-800': String(agent.role_type || '') === 'QA'
                    }" x-text="agent.role_type"></span>
                </div>
                <p class="text-xs text-slate-400 mt-1 font-mono flex items-center justify-between">
                    <span x-text="'ID: ' + agent.agent_id"></span>
                    <span class="inline-flex items-center gap-1 text-[10px] text-emerald-400">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span> Trực chiến
                    </span>
                </p>
            </div>
        </template>
    </div>
</aside>
