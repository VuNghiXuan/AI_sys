<!-- File: templates/enterprise_factory/command_center.html -->
{% load static %}
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>vnxBox Enterprise - Live War Room</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- File JS điều khiển chuyên biệt -->
    <script src="{% static 'enterprise_factory/js/war_room.js' %}"></script>
</head>

<body class="bg-slate-950 text-slate-100 font-sans antialiased h-screen flex flex-col overflow-hidden"
    x-data="enterpriseApp()">

    <!-- Header Bar -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
            <h1 class="text-xl font-bold tracking-wide text-emerald-400">vnxBox Enterprise <span
                    class="text-xs text-slate-400 font-normal">| ViberClone War Room (Giai đoạn 1)</span></h1>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-xs bg-slate-800 px-3 py-1.5 rounded border border-slate-700 text-slate-300">Khối ngành:
                <strong class="text-emerald-400" x-text="selectedCompany"></strong></span>
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="flex-1 flex overflow-hidden">

        <!-- Sidebar: Danh sách nhân sự AI trực chiến -->
        <aside class="w-80 bg-slate-900/60 border-r border-slate-800 flex flex-col">
            <div class="p-4 border-b border-slate-800 bg-slate-900/80">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Hội đồng nhân sự trực chiến
                </h2>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-3">
                <template x-for="agent in agents" :key="agent.agent_id">
                    <div
                        class="bg-slate-800/60 border border-slate-700/60 rounded-lg p-3 shadow-sm hover:border-emerald-500/50 transition">
                        <div class="flex justify-between items-start">
                            <h3 class="font-semibold text-sm text-slate-200" x-text="agent.display_name"></h3>
                            <span class="text-[10px] px-2 py-0.5 rounded font-mono"
                                :class="agent.role_type === 'BOD' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-sky-500/20 text-sky-300 border border-sky-500/30'"
                                x-text="agent.role_type"></span>
                        </div>
                        <p class="text-xs text-slate-400 mt-1 font-mono" x-text="'ID: ' + agent.agent_id"></p>
                    </div>
                </template>
            </div>
        </aside>

        <!-- Center & Right: Phòng họp Viber Room & Quản lý Code Patches -->
        <main class="flex-1 flex flex-col bg-slate-950">

            <!-- Tab nội dung phòng họp (Scrollable Chat Workspace) -->
            <div class="flex-1 overflow-y-auto p-6 space-y-4 flex flex-col-reverse">
                <template x-for="disc in discussions" :key="disc.id">
                    <div>
                        <!-- TRƯỜNG HỢP 1: TIN NHẮN CHỈ ĐẠO CỦA SẾP (User) -->
                        <template x-if="!disc.agent_name || disc.phase === 'USER_DIRECTIVE'">
                            <div class="flex flex-col items-end my-2">
                                <div class="flex items-center space-x-2 mb-1">
                                    <span class="text-[10px] text-slate-400 font-mono" x-text="disc.created_at"></span>
                                    <span
                                        class="text-xs font-bold text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800/50">Sếp
                                        Vũ</span>
                                </div>
                                <div
                                    class="bg-emerald-900/30 border border-emerald-500/40 rounded-2xl rounded-tr-none px-4 py-3 max-w-2xl shadow-md">
                                    <p class="text-sm text-slate-100 whitespace-pre-wrap leading-relaxed"
                                        x-text="disc.message_content"></p>
                                </div>
                            </div>
                        </template>

                        <!-- TRƯỜNG HỢP 2: PHẢN HỒI CỦA NHÂN SỰ AI (BOD / DEV) -->
                        <template x-if="disc.agent_name && disc.phase !== 'USER_DIRECTIVE'">
                            <div class="flex flex-col items-start my-2">
                                <div class="flex items-center space-x-2 mb-1">
                                    <span
                                        class="text-xs font-bold text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded border border-amber-800/50"
                                        x-text="disc.agent_name"></span>
                                    <span
                                        class="bg-slate-800 text-slate-400 px-2 py-0.5 rounded text-[10px] font-mono uppercase"
                                        x-text="disc.phase"></span>
                                    <span class="text-[10px] text-slate-500 font-mono" x-text="disc.created_at"></span>
                                </div>
                                <div
                                    class="bg-slate-900/90 border border-slate-800 rounded-2xl rounded-tl-none px-4 py-3 max-w-3xl shadow-md">
                                    <p class="text-sm text-slate-200 whitespace-pre-wrap leading-relaxed"
                                        x-text="disc.message_content"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <!-- Khu vực Code Patches chờ duyệt (Approval-Gated Panel) -->
            <d<!-- KHU VỰC BẢN VÁ CODE CHỜ SẾP PHÊ DUYỆT (PENDING PATCHES) -->
                <div class="bg-slate-900 border-t border-slate-800 p-4" x-show="patches.length > 0">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center space-x-2">
                            <span class="inline-block w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                            <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider">
                                BẢN VÁ CODE CHỜ SẾP PHÊ DUYỆT (<span
                                    x-text="patches.filter(p => p.status === 'PENDING').length"></span> PENDING)
                            </h3>
                        </div>
                        <span class="text-[10px] text-slate-500 font-mono">Hệ thống Sandbox An toàn</span>
                    </div>

                    <!-- Danh sách các file patch đang chờ -->
                    <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
                        <template x-for="patch in patches.filter(p => p.status === 'PENDING')" :key="patch.id">
                            <div
                                class="bg-slate-950 border border-slate-800 rounded-lg p-3 flex items-center justify-between shadow-sm">
                                <div class="flex items-center space-x-3 overflow-hidden">
                                    <span
                                        class="bg-amber-950/80 text-amber-400 border border-amber-800/50 text-[10px] font-mono px-2 py-0.5 rounded"
                                        x-text="`ID: ${patch.id}`"></span>
                                    <span class="text-xs font-mono text-emerald-400 font-semibold truncate"
                                        x-text="patch.target_file"></span>
                                </div>
                                <div class="flex items-center space-x-2 shrink-0">
                                    <!-- Nút xem/ẩn nhanh code (nếu muốn mở rộng) hoặc duyệt trực tiếp -->
                                    <button @click="approvePatch(patch.id)"
                                        class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-3 py-1.5 rounded transition shadow">
                                        Approve & Apply
                                    </button>
                                    <button @click="rejectPatch(patch.id)"
                                        class="bg-rose-900/60 hover:bg-rose-800 text-rose-300 border border-rose-700/50 text-xs font-medium px-2.5 py-1.5 rounded transition">
                                        Hủy (Reject)
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Fixed Bottom Input Bar -->
                <div class="bg-slate-900 border-t border-slate-800 p-4">
                    <form @submit.prevent="sendDirective()" class="flex space-x-3">
                        <input type="text" x-model="directiveText"
                            placeholder="Nhập chỉ đạo cho nhân sự AI (VD: Chào em | Viết code tính toán doanh thu vàng)..."
                            class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">

                        <button type="submit" :disabled="loading"
                            class="bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 disabled:opacity-50 text-white font-semibold px-6 py-3 rounded-lg text-sm shadow-md transition flex items-center justify-center min-w-[120px]">
                            <span x-show="!loading" class="text-white">Gửi chỉ đạo</span>
                            <span x-show="loading" class="text-white flex items-center">Đang gửi...</span>
                        </button>
                    </form>
                </div>

        </main>
    </div>

</body>

</html>
