<!-- File: enterprise_factory/templates/enterprise_factory/war_room.html -->
{% load static %}
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>vnxBox Enterprise - Live War Room</title>

    <style>
        [x-cloak] {
            display: none !important;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 3px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(71, 85, 105, 1);
        }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Nạp tệp JavaScript Master tổng hợp duy nhất -->
    <script src="{% static 'enterprise_factory/js/war_room.js' %}?v=2026_master"></script>
</head>

<body class="bg-slate-950 text-slate-100 font-sans antialiased h-screen flex flex-col overflow-hidden"
    x-data="warRoomMaster()" x-init="init()" x-cloak>

    <!-- Header Bar Tổng Thể -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-md z-20">
        <div class="flex items-center space-x-3">
            <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
            <h1 class="text-xl font-bold tracking-wide text-emerald-400">
                vnxBox Enterprise
                <span class="text-xs text-slate-400 font-normal">| Live War Room (AI Boardroom)</span>
            </h1>
        </div>
        <div class="flex items-center space-x-4">
            <!-- Hiển thị nhanh số lượng Tool & Workflow đang hoạt động -->
            <span class="text-xs bg-slate-800 px-2.5 py-1 rounded border border-slate-700 text-cyan-400 font-mono"
                x-text="`Tools: ${dynamicTools.length} | Workflows: ${dynamicWorkflows.length}`"></span>

            <span class="text-xs bg-slate-800 px-3 py-1.5 rounded border border-slate-700 text-emerald-300 font-mono"
                x-text="statusText"></span>
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- 1. COMPONENT: Sidebar Danh sách nhân sự AI -->
        {% include "enterprise_factory/components/_sidebar_agents.html" %}

        <!-- Center Workspace -->
        <main class="flex-1 flex flex-col bg-slate-950 relative overflow-hidden">

            <!-- 2. COMPONENT: Vùng hiển thị luồng chat cuộc họp (Hiển thị trực tiếp mọi tin nhắn & tiến trình ngầm tại đây) -->
            {% include "enterprise_factory/components/_chat_stream.html" %}

            <!-- 3. COMPONENT: Thanh nhập liệu & Popup @Mention (Đã loại bỏ terminal popup thừa) -->
            {% include "enterprise_factory/components/_input_bar.html" %}

        </main>
    </div>

</body>

</html>
