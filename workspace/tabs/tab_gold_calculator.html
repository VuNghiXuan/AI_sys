<!-- Path: workspace/tabs/tab_gold_calculator.html -->
<!-- 
Mục đích: Component Tab Tính toán Định mức Vàng và Tỷ lệ Hao hụt Nguyên liệu.
Được sinh tự động bởi ENG_VIBER_DEV_01 theo chỉ định của BOD_CEO_01.
Độ dài: ~140 dòng (< 300 dòng theo quy chuẩn dự án).
-->
<div x-data="goldCalcApp()" class="p-6 space-y-6 bg-slate-900 rounded-xl border border-slate-800">
    <div class="border-b border-slate-800 pb-3 flex justify-between items-center">
        <div>
            <h3 class="text-lg font-bold text-amber-400">📊 Quản lý Định mức Vàng & Hao hụt Chế tác</h3>
            <p class="text-xs text-slate-400">Nghiệp vụ hạch toán trọng lượng vàng thô, vàng thành phẩm và tỷ lệ hao hụt
                cho phép.</p>
        </div>
        <span class="text-xs font-mono bg-amber-950 text-amber-400 border border-amber-800 px-2.5 py-1 rounded-full">
            Agent: BIZ_GOLD_CALC_01
        </span>
    </div>

    <!-- Form nhập liệu -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Trọng lượng Vàng thô (Chỉ)</label>
            <input type="number" step="0.01" x-model.number="rawWeight"
                class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
        </div>
        <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Trọng lượng Thành phẩm (Chỉ)</label>
            <input type="number" step="0.01" x-model.number="finishedWeight"
                class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
        </div>
        <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Định mức Hao hụt Cho phép (%)</label>
            <input type="number" step="0.1" x-model.number="allowedLossRate"
                class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
        </div>
    </div>

    <!-- Bảng kết quả hạch toán -->
    <div class="bg-slate-950 p-4 rounded-lg border border-slate-800 space-y-3">
        <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Kết quả Hạch toán Chi tiết</h4>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
            <div class="bg-slate-900 p-3 rounded border border-slate-800">
                <div class="text-[11px] text-slate-400">Hao hụt Thực tế</div>
                <div class="text-base font-bold font-mono text-slate-100" x-text="actualLoss().toFixed(3) + ' Chỉ'">
                </div>
            </div>
            <div class="bg-slate-900 p-3 rounded border border-slate-800">
                <div class="text-[11px] text-slate-400">Tỷ lệ Hao hụt Thực tế</div>
                <div class="text-base font-bold font-mono"
                    :class="actualLossRate() > allowedLossRate ? 'text-rose-400' : 'text-emerald-400'"
                    x-text="actualLossRate().toFixed(2) + ' %'"></div>
            </div>
            <div class="bg-slate-900 p-3 rounded border border-slate-800">
                <div class="text-[11px] text-slate-400">Hao hụt Cho phép</div>
                <div class="text-base font-bold font-mono text-slate-100" x-text="allowedLoss().toFixed(3) + ' Chỉ'">
                </div>
            </div>
            <div class="bg-slate-900 p-3 rounded border border-slate-800">
                <div class="text-[11px] text-slate-400">Đánh giá Nghiệp vụ</div>
                <div class="text-xs font-bold mt-1 px-2 py-0.5 rounded"
                    :class="isOverAllowed() ? 'bg-rose-950 text-rose-400 border border-rose-800' : 'bg-emerald-950 text-emerald-400 border border-emerald-800'"
                    x-text="isOverAllowed() ? 'VƯỢT ĐỊNH MỨC' : 'ĐẠT ĐỊNH MỨC'"></div>
            </div>
        </div>
    </div>
</div>

<script>
    function goldCalcApp() {
        return {
            rawWeight: 10.0,
            finishedWeight: 9.85,
            allowedLossRate: 1.2,

            // Hàm tính trọng lượng hao hụt thực tế
            actualLoss() {
                return Math.max(0, this.rawWeight - this.finishedWeight);
            },
            // Hàm tính tỷ lệ hao hụt thực tế %
            actualLossRate() {
                if (!this.rawWeight) return 0;
                return (this.actualLoss() / this.rawWeight) * 100;
            },
            // Hàm tính trọng lượng hao hụt tối đa cho phép
            allowedLoss() {
                return (this.rawWeight * this.allowedLossRate) / 100;
            },
            // Kiểm tra vượt định mức
            isOverAllowed() {
                return this.actualLossRate() > this.allowedLossRate;
            }
        }
    }
</script>
