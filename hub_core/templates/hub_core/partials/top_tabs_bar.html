<!-- File Path: hub_core/templates/hub_core/partials/top_tabs_bar.html -->
<!-- Description: Thanh điều hướng tab trên đầu cho cấu hình, kết quả, lộ trình và bản đồ. -->
<div class="top-bar" role="tablist" aria-label="Chế độ hiển thị chính">
    <div style="display:flex;align-items:center;gap:10px;">
        <strong style="color:var(--accent);font-size:14px;">vnxBox Studio</strong>
        <span class="muted">Multi-App &amp; Vibe Builder</span>
    </div>

    <div id="topTabsGroup" style="display:flex;gap:6px;flex-wrap:wrap;">
        <button type="button" class="tab-btn active" data-tab="stream">Luồng &amp; Lộ trình</button>
        <button type="button" class="tab-btn" data-tab="config">Cấu hình</button>
        <button type="button" class="tab-btn" data-tab="results">Kết quả &amp; Báo cáo</button>
        <button type="button" class="tab-btn" data-tab="graph">Graph &amp; Impact</button>
    </div>

    <div id="topStatusBadge" class="muted">Chế độ: Auto</div>
</div>

<style>
    .tab-btn {
        background: var(--card);
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12px;
        cursor: pointer;
    }

    .tab-btn.active {
        background: var(--accent);
        color: #082f49;
        font-weight: 600;
        border-color: var(--accent);
    }
</style>

<script>
    (function () {
        const group = document.getElementById("topTabsGroup");
        if (!group) return;
        group.addEventListener("click", (e) => {
            const btn = e.target.closest(".tab-btn");
            if (!btn) return;
            group.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            const tab = btn.dataset.tab;
            window.dispatchEvent(new CustomEvent("vnxbox:tab", { detail: { tab } }));
            window.VnxUI?.pushStream({
                agent: "UIController",
                action: `Chuyển sang tab '${tab}'`,
                detail: `Hiển thị khung nhìn tương ứng cho tab ${tab}.`,
                progress: "Cập nhật giao diện"
            });
        });
    })();
</script>
