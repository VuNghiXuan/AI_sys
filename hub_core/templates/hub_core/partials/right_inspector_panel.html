<!-- File Path: hub_core/templates/hub_core/partials/right_inspector_panel.html -->
<!-- Description: Cột phải hiển thị lịch sử thao tác và biểu đồ/chỉ số tiến độ. -->
<div class="block">
    <div style="font-weight:600;font-size:13px;margin-bottom:8px;">Biểu Đồ &amp; Chỉ Số Nhịp Làm Việc</div>
    <div id="miniChartBars"
        style="display:flex;align-items:flex-end;gap:8px;height:84px;padding:8px;background:var(--panel);border-radius:6px;">
        <div class="bar-col" data-val="35" style="height:35%;" title="Phân tích"><span>P1</span></div>
        <div class="bar-col" data-val="60" style="height:60%;" title="Ngữ cảnh"><span>P2</span></div>
        <div class="bar-col" data-val="85" style="height:85%;" title="Sinh &amp; Test"><span>P3</span></div>
        <div class="bar-col" data-val="50" style="height:50%;" title="Báo cáo"><span>P4</span></div>
    </div>
    <div class="muted" style="margin-top:6px;">Biểu đồ mức độ hoàn tất theo từng chặng lộ trình.</div>
</div>

<div class="block">
    <div style="font-weight:600;font-size:13px;margin-bottom:8px;">Lịch Sử Phiên &amp; Lệnh</div>
    <ul id="historyList"
        style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:12px;">
        <li class="muted">• Khởi động Workbench (Auto)</li>
    </ul>
</div>

<style>
    .bar-col {
        flex: 1;
        background: var(--accent);
        border-radius: 4px 4px 0 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        min-height: 12px;
    }

    .bar-col span {
        font-size: 10px;
        color: #082f49;
        font-weight: 700;
        padding-bottom: 2px;
    }
</style>

<script>
    (function () {
        const histEl = document.getElementById("historyList");
        if (!histEl) return;
        window.addEventListener("vnxbox:prompt", (e) => {
            const { prompt, mode, target } = e.detail || {};
            const now = new Date().toLocaleTimeString("vi-VN");
            const li = document.createElement("li");
            li.textContent = `• [${now}] (${mode}${target ? " @" + target : ""}) ${prompt}`;
            histEl.prepend(li);
        });
    })();
</script>
