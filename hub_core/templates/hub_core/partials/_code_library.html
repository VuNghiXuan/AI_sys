<!-- 
  # File Path: hub_core/templates/hub_core/partials/_code_library.html
  # Purpose: Quản lý Thư viện Code ở cột phải và khung Xem Nhanh Code một chạm (One-Click Inspection).
-->
<aside class="w-80 bg-sidebarbg border-l border-bordercolor flex flex-col shrink-0">
    <div class="p-4 border-b border-bordercolor flex justify-between items-center">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">📦 Thư Viện Code</span>
        <span
            class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-mono">
            {{ generated_files|length }} modules</span>
    </div>

    <div class="p-3 space-y-2 overflow-y-auto max-h-[45%] text-xs">
        {% for file in generated_files %}
        <div onclick="loadSourceCode('{{ file.path }}')"
            class="bg-slate-900 hover:bg-slate-800 border border-bordercolor rounded-lg p-3 cursor-pointer transition space-y-1 group">
            <div class="font-mono font-semibold text-indigo-400 group-hover:text-indigo-300 truncate">
                {{ file.filename }}</div>
            <div class="text-slate-500 text-[10px]">Path: {{ file.path }}</div>
        </div>
        {% empty %}
        <div class="text-center py-6 text-slate-500 text-xs">Chưa có module nào được sinh ra.</div>
        {% endfor %}
    </div>

    <div class="flex-1 border-t border-bordercolor bg-slate-950 p-3 flex flex-col overflow-hidden">
        <div class="text-[11px] text-slate-400 font-semibold mb-2 flex justify-between items-center shrink-0">
            <span>🔍 Xem Nhanh Code</span>
            <span id="preview-filename" class="text-indigo-400 font-mono truncate max-w-[140px]">Chọn file trên</span>
        </div>
        <pre id="quick-preview-code"
            class="flex-1 bg-slate-900 text-emerald-400 p-3 rounded-lg text-[10px] overflow-auto font-mono leading-relaxed whitespace-pre-wrap select-all">Bấm vào thẻ tệp bên trên để xem chi tiết mã nguồn ngay lập tức...</pre>
    </div>
</aside>
