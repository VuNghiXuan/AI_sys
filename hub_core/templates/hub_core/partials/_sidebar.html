<!-- 
  # File Path: hub_core/templates/hub_core/partials/_sidebar.html
  # Purpose: Hiển thị danh sách Lịch sử Job (War Room) kèm nút xóa nhanh, tối ưu hóa CSS hover tương tác.
-->
<aside id="left-sidebar"
    class="w-64 bg-sidebarbg border-r border-bordercolor flex flex-col transition-all duration-300 shrink-0 relative">
    <div class="p-4 border-b border-bordercolor flex justify-between items-center">
        <span id="sidebar-title" class="text-xs font-semibold uppercase tracking-wider text-slate-400 truncate">Lịch sử
            Job (War Room)</span>
        <button onclick="toggleSidebar()"
            class="text-slate-400 hover:text-white p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 transition flex items-center justify-center text-xs"
            title="Thu gọn / Mở rộng">
            <span id="toggle-icon">◀</span>
        </button>
    </div>

    <div id="sidebar-job-list" class="p-3 space-y-1.5 overflow-y-auto flex-1 text-sm font-mono">
        {% for j in jobs %}
        <div class="relative flex items-center group">
            <!-- Thẻ Link xem Job -->
            <a href="?job_id={{ j.job_id }}"
                class="w-full truncate px-3 py-2 pr-8 rounded text-xs {% if active_job and active_job.job_id == j.job_id %}bg-indigo-600 text-white font-bold shadow{% elif j.status == 'SUCCESS' %}text-emerald-400 bg-emerald-500/5 hover:bg-emerald-500/10{% elif j.status == 'RUNNING' %}text-amber-400 bg-amber-500/5 hover:bg-amber-500/10 animate-pulse{% else %}text-rose-400 bg-rose-500/5 hover:bg-rose-500/10{% endif %} border border-transparent hover:border-slate-700 transition block"
                title="[{{ j.status }}] {{ j.request_id }}">
                [{{ j.status }} {{ j.request_id }}
            </a>

            <!-- Nút xóa: Hiện mờ khi bình thường, sáng rõ (opacity-100) khi rê chuột vào khung chứa (group) -->
            <button onclick="deleteJob('{{ j.job_id }}', event)"
                class="absolute right-2.5 text-slate-400 hover:text-rose-400 p-1 transition opacity-40 group-hover:opacity-100 text-xs font-bold"
                title="Xóa Job này">
                ✕
            </button>
        </div>
        {% empty %}
        <div class="text-center py-6 text-slate-500 text-xs">Chưa có lịch sử job.</div>
        {% endfor %}
    </div>
</aside>
