<!-- 
  # File Path: hub_core/templates/hub_core/base.html
  # Purpose: Layout khung xương gốc toàn hệ thống, chứa hàm global deleteJob phục vụ xóa job trực tiếp từ sidebar.
-->
<!DOCTYPE html>
<html lang="vi" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}vnxBox Enterprise - Autonomous AI Control Center{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0f19',
                        sidebarbg: '#111827',
                        cardbg: '#1f2937',
                        bordercolor: '#374151',
                        accent: '#6366f1'
                    }
                }
            }
        }
    </script>
    {% block extra_head %}{% endblock %}
</head>

<body class="bg-darkbg text-slate-100 h-screen overflow-hidden font-sans antialiased flex flex-col">

    <!-- TOP NAVIGATION BAR -->
    <header class="h-14 border-b border-bordercolor bg-sidebarbg px-4 flex justify-between items-center z-50 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse" id="live-indicator"></div>
            <span class="font-bold text-lg tracking-tight text-white">vnxBox <span
                    class="text-indigo-400">Enterprise</span></span>
            <span
                class="text-xs px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-mono">Live
                War Room</span>
        </div>

        <div class="flex items-center space-x-3 text-sm">
            <button onclick="alert('Cấu hình hệ thống: Local Ollama Qwen2.5-coder, RAM 32GB, CPU Multi-thread tối ưu.')"
                class="bg-slate-800 hover:bg-slate-700 border border-bordercolor px-3 py-1.5 rounded-lg flex items-center gap-2 transition text-slate-300 text-xs font-medium">
                <span>⚙️</span> Cấu hình Hệ thống
            </button>
            <button
                onclick="alert('Nhân viên AI Swarm: PM Agent (Đặc tả), Coder Agent (Vibe Code), QC Agent (Sandbox Pytest).')"
                class="bg-slate-800 hover:bg-slate-700 border border-bordercolor px-3 py-1.5 rounded-lg flex items-center gap-2 transition text-slate-300 text-xs font-medium">
                <span>🤖</span> Nhân viên AI
            </button>
            <button onclick="alert('Quy trình DAG: Blueprint-Driven Task Decomposition & Circuit Breaker tự sửa lỗi.')"
                class="bg-slate-800 hover:bg-slate-700 border border-bordercolor px-3 py-1.5 rounded-lg flex items-center gap-2 transition text-slate-300 text-xs font-medium">
                <span>📊</span> Quy trình DAG
            </button>
            <span id="job-status-badge" class="px-3 py-1 text-xs font-semibold rounded-full font-mono 
                {% if active_job.status == 'SUCCESS' %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20
                {% elif active_job.status == 'RUNNING' %}bg-amber-500/10 text-amber-400 border border-amber-500/20 animate-pulse
                {% else %}bg-indigo-500/10 text-indigo-300 border border-indigo-500/20{% endif %} ml-2">
                {{ active_job.status|default:"READY" }}
            </span>
        </div>
    </header>

    <!-- MAIN BODY LAYOUT (3 COLUMNS CONTAINER) -->
    <div class="flex-1 flex overflow-hidden">
        {% block content %}{% endblock %}
    </div>

    <!-- GLOBAL JAVASCRIPT FUNCTIONS (Đảm bảo các hàm global như deleteJob luôn khả dụng) -->
    <script>
        function deleteJob(jobId, event) {
            event.stopPropagation(); // Ngăn sự kiện bấm nhầm vào thẻ a xung quanh
            if (!confirm("Bạn có chắc chắn muốn xóa Job này khỏi lịch sử không?")) return;

            // Lấy CSRF Token từ trang
            const csrfInput = document.querySelector('[name=csrfmiddlewaretoken]');
            const csrfToken = csrfInput ? csrfInput.value : '';

            fetch(`/api/job/${jobId}/delete/`, {
                method: "POST",
                headers: {
                    "X-CSRFToken": csrfToken,
                    "Content-Type": "application/json"
                }
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        console.log(`[SYSTEM_LOG] Đã xóa thành công job: ${jobId}`);
                        window.location.href = "/"; // Reload về trang chủ sau khi xóa
                    } else {
                        alert("[ERROR] Không thể xóa job: " + (data.error || 'Lỗi không xác định'));
                    }
                })
                .catch(err => console.error("[API_ERROR] Lỗi khi gọi API xóa job:", err));
        }
    </script>

    {% block extra_js %}{% endblock %}
</body>

</html>
