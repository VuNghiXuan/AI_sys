<aside class="cot-trai">
    <div>
        <div class="tieu-de-muc-nho">Trang chính</div>
        <button type="button" class="nut-danh-muc dang-chon" data-trang="chat_studio">
            <span>Chat &amp; Prompt Studio</span>
            <span>CHÍNH</span>
        </button>

        <div class="tieu-de-muc-nho" style="margin-top: 14px;">Trang con &amp; Component</div>
        <div id="danhSachTrangCon">
            <button type="button" class="nut-danh-muc" data-trang="kiem_thu_nghiep_vu">
                <span>Kiểm thử &amp; Nghiệp vụ</span>
                <span>TEST</span>
            </button>
            <button type="button" class="nut-danh-muc" data-trang="quan_ly_plugin_js">
                <span>Quản lý trang con &amp; JS</span>
                <span>PLUGIN</span>
            </button>
        </div>
    </div>

    <form class="khung-cam-trang-con" id="formCamTrangCon">
        <div class="tieu-de-muc-nho" style="margin-bottom: 0;">+ Cắm trang con / JS mới</div>
        <input type="text" class="o-nhap-nho" id="tenTrangConMoi" placeholder="Tên trang con (VD: Đối soát kho)" />
        <input type="text" class="o-nhap-nho" id="tenModuleJsMoi" placeholder="Tên file JS (VD: doi_soat_kho.js)" />
        <button type="submit" class="nut-xanh">Thêm vào danh mục</button>
    </form>
</aside>
